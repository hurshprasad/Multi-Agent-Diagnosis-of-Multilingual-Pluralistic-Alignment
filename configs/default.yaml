# Default experiment config. Override per run with a second YAML (see configs/smoke.yaml).

project:
  name: mpac
  seed: 42
  # Root for all cached artifacts. On Colab, paths.resolve_root() swaps this for
  # /content/drive/MyDrive/<drive_subdir> when Drive is mounted, so caches survive runtime resets.
  root: ./artifacts
  drive_subdir: mpac

languages:
  reference: en
  targets: [pt, es, it, de, fr]   # Portuguese, Spanish, Italian, German, French

objectives: [helpfulness, honesty, pluralistic_value]

models:
  - id: qwen2.5-7b
    hf_name: Qwen/Qwen2.5-7B-Instruct
    small_variant: Qwen/Qwen2.5-1.5B-Instruct   # for T4 / smoke tests
  - id: llama3.1-8b
    hf_name: meta-llama/Llama-3.1-8B-Instruct   # gated: needs HF_TOKEN with access granted
    small_variant: meta-llama/Llama-3.2-1B-Instruct

checkpoints: [base, en_aligned, multi_aligned]

generation:
  backend: transformers          # transformers | vllm
  load_in_4bit: true             # needed for 7-8B on a 16 GB T4
  max_new_tokens: 512
  temperature: 0.0
  batch_size: 8

data:
  # Proposed sources per objective (docs/decisions.md, D1). Not final until the team signs off.
  dataset: agdhruv/plural-alignment            # PLURAL: pluralistic_value prompts + DPO pairs
  sources:
    pluralistic_value: agdhruv/plural-alignment   # + its `survey_questions` config (forced choice)
    honesty: truthfulqa/truthful_qa               # `multiple_choice` config, mc1 targets
    helpfulness: HuggingFaceH4/ultrafeedback_binarized   # `test_prefs` split
  n_eval_prompts: 500
  n_verified_per_lang: 100       # manually checked translations
  n_oracle_labels: 300           # human-labelled items used to score evaluators
  tune_frac: 0.333               # share of items whose oracle labels may tune thresholds (data/splits.py)

build:                           # items drawn per source by data/build.py (about 500 in total)
  wvs: 111                       # all WVS survey questions (forced choice)
  plural: 90                     # PLURAL prompts (free text)
  truthfulqa: 150                # forced choice: correct answer + 3 distractors
  truthfulqa_max_options: 4
  ultrafeedback: 150             # short, non-code prompts (free text)

translation:
  model: google/madlad400-3b-mt  # proposed (D4); compare in notebooks/02_phase0_decisions.ipynb

oracle:                          # proposed protocol (D7, docs/oracle_protocol.md)
  annotators_per_item: 2
  min_kappa: 0.6                 # below this, revise the guidelines before labelling more

training:                        # training/dpo.py; identical for en_aligned and multi_aligned
  method: dpo
  use_lora: true
  n_pairs: 3000                  # PLURAL pairs, stratified over countries (D8, option b)
  budget_steps: 375              # = 2 epochs of n_pairs at batch_size x grad_accum = 16
  n_heldout: 200                 # held-out PLURAL pairs, in every language, for the manipulation check
  pool: null                     # cap on length-filtered PLURAL rows to draw from (null = all)
  max_words: 300                 # per response; Hindi needs ~2-3x the tokens of English
  max_paragraph_words: 150       # MADLAD translates line by line (512-token input)
  mt_batch_size: 32              # lines per MADLAD batch when translating pairs (16 on a T4)
  beta: 0.1
  learning_rate: 2.0e-5          # LoRA
  batch_size: 1
  grad_accum: 16
  max_length: 1536               # prompt + response tokens, same for every language
  save_steps: 25                 # checkpoint to Drive, resume after a disconnect
  lora: {r: 16, alpha: 32, dropout: 0.05}

agents:
  population_cap: 24
  lifecycle_cycles: 10
  batch_per_cycle: 50            # items each agent evaluates per cycle
  retain_threshold: 0.6          # min utility to survive a cycle
  redundancy_threshold: 0.95     # agreement above this with a better agent => destroy
  spawn_on_unexplained_divergence: 0.15
  evaluator_type: lightweight    # lightweight | llm_judge
