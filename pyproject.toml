[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mpac"
version = "0.1.0"
description = "Multi-agent diagnosis of multilingual pluralistic alignment collapse"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MPL-2.0" }
# Core deps are kept light so `pip install -e .` is fast on Colab and on CPU-only machines.
dependencies = [
    "numpy>=1.24",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "pandas>=2.0",
]

[project.optional-dependencies]
# Generation / training / interpretability on GPU (Colab T4, L4 or A100).
gpu = [
    "torch>=2.2",
    "transformers>=4.44",
    "accelerate>=0.33",
    "datasets>=2.20",
    "bitsandbytes>=0.43",   # 4-bit loading so 7-8B models fit on a T4
    "trl>=0.12",             # conversational DPO data
    "peft>=0.12",
    "sentencepiece>=0.2",   # MADLAD / NLLB tokenizers
    "sacrebleu>=2.4",       # chrF for MT round-trip checks
]
# Optional fast batched generation (works on L4/A100 runtimes; often fails on T4).
vllm = ["vllm>=0.5"]
# Cheap evaluation signals.
signals = [
    "sentence-transformers>=3.0",   # LaBSE cross-lingual similarity
    "fasttext-langdetect>=1.0",     # language-ID check for silent language switching
]
dev = ["pytest>=8.0", "ruff>=0.5", "sacrebleu>=2.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
